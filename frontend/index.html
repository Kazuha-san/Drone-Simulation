<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bhopal Drone Delivery Feasibility Simulator</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --accent: #4fd6a8;
    --accent2: #ff6b6b;
    --text: #e8eaed;
    --muted: #8a919e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid #2a2e37;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button {
    background: #262a33; color: var(--text); border: 1px solid #383e4a;
    border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #08110d; font-weight: 600; border: none; }
  main { flex: 1; display: flex; overflow: hidden; }
  #mapWrap { flex: 1; position: relative; background: #0e1013; }
  canvas { display: block; }
  #sidebar {
    width: 300px; background: var(--panel); border-left: 1px solid #2a2e37;
    padding: 16px; overflow-y: auto; font-size: 13px;
  }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 0 8px; }
  #sidebar h2:first-child { margin-top: 0; }
  .metric-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #262a33; }
  .metric-row .val { font-weight: 600; }
  .metric-row .val.good { color: var(--accent); }
  .metric-row .val.bad { color: var(--accent2); }
  #scrubberBar {
    background: var(--panel); border-top: 1px solid #2a2e37; padding: 10px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  #scrubber { flex: 1; }
  #timeLabel { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; width: 80px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Bhopal Drone Delivery Feasibility Simulator</h1>
    <div class="sub">Physics-grounded E-VRPTW simulation — drones vs. ground riders</div>
  </div>
  <div class="controls">
    <select id="scenarioSelect">
      <option value="mixed">Mixed Fleet</option>
      <option value="drones_only">Drones Only</option>
      <option value="riders_only">Riders Only (baseline)</option>
    </select>
    <button id="playBtn" class="primary">▶ Play</button>
    <button id="loadBtn">Reload trace.json</button>
  </div>
</header>

<main>
  <div id="mapWrap">
    <canvas id="mapCanvas"></canvas>
  </div>
  <div id="sidebar">
    <h2>Scenario Summary</h2>
    <div id="summaryBox"></div>
    <h2>Optimality Gap Demo</h2>
    <div id="gapBox"></div>
    <h2>Legend</h2>
    <div class="legend">
      <span><span class="dot" style="background:#3aa0ff"></span> Dark store</span>
      <span><span class="dot" style="background:#ffd166"></span> Delivery zone</span>
      <span><span class="dot" style="background:var(--accent)"></span> Drone</span>
      <span><span class="dot" style="background:#c084fc"></span> Rider</span>
      <span><span class="dot" style="background:var(--accent2)"></span> No-fly zone</span>
    </div>
  </div>
</main>

<div id="scrubberBar">
  <button id="stepBack">⏮</button>
  <input type="range" id="scrubber" min="0" max="3600" value="0">
  <button id="stepFwd">⏭</button>
  <div id="timeLabel">00:00</div>
</div>

<script>
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const CANVAS_UNITS = 2000; // matches CityGraph canvas space in graph.py

let trace = null;
let currentScenario = 'mixed';
let simTime = 0;
let playing = false;
let animFrame = null;

function resizeCanvas() {
  const wrap = document.getElementById('mapWrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
window.addEventListener('resize', () => { resizeCanvas(); draw(); });

function toScreen(x, y) {
  const scale = Math.min(canvas.width, canvas.height) / CANVAS_UNITS;
  const offsetX = (canvas.width - CANVAS_UNITS * scale) / 2;
  const offsetY = (canvas.height - CANVAS_UNITS * scale) / 2;
  return [x * scale + offsetX, y * scale + offsetY];
}

async function loadTrace() {
  try {
    const res = await fetch('../data/trace.json');
    trace = await res.json();
  } catch (e) {
    document.getElementById('summaryBox').innerHTML =
      '<div style="color:var(--accent2)">Could not fetch data/trace.json — serve this folder with a local HTTP server (e.g. <code>python3 -m http.server</code> from the repo root), file:// fetch is blocked by browsers.</div>';
    return;
  }
  const maxTime = trace.scenarios[currentScenario].orders.slice(-1)[0]?.created_at_s || 3600;
  document.getElementById('scrubber').max = Math.ceil(maxTime + 300);
  renderSummary();
  draw();
}

function renderSummary() {
  const s = trace.scenarios[currentScenario].summary;
  const box = document.getElementById('summaryBox');
  const fmtT = (sec) => sec > 60 ? (sec/60).toFixed(1) + ' min' : sec.toFixed(0) + ' s';
  box.innerHTML = `
    <div class="metric-row"><span>Total orders</span><span class="val">${s.total_orders}</span></div>
    <div class="metric-row"><span>Delivered</span><span class="val good">${s.delivered}</span></div>
    <div class="metric-row"><span>Failed</span><span class="val ${s.failed>0?'bad':''}">${s.failed}</span></div>
    <div class="metric-row"><span>Failure rate</span><span class="val ${s.failure_rate>0.2?'bad':''}">${(s.failure_rate*100).toFixed(1)}%</span></div>
    <div class="metric-row"><span>SLA violations</span><span class="val ${s.sla_violations>0?'bad':''}">${s.sla_violations}</span></div>
    <div class="metric-row"><span>P50 delivery time</span><span class="val">${fmtT(s.p50_delivery_time_s)}</span></div>
    <div class="metric-row"><span>P95 delivery time</span><span class="val">${fmtT(s.p95_delivery_time_s)}</span></div>
    <div class="metric-row"><span>Avg cost / delivery</span><span class="val">₹${s.avg_cost_inr.toFixed(2)}</span></div>
    <div class="metric-row"><span>Throughput</span><span class="val">${s.orders_per_hour_actual.toFixed(1)} /hr</span></div>
  `;

  const gap = trace.optimality_gap_demo;
  document.getElementById('gapBox').innerHTML = `
    <div class="metric-row"><span>Greedy cost</span><span class="val">${gap.greedy_cost.toFixed(1)}</span></div>
    <div class="metric-row"><span>Optimal (brute-force) cost</span><span class="val">${gap.optimal_cost.toFixed(1)}</span></div>
    <div class="metric-row"><span>Optimality gap</span><span class="val good">${gap.optimality_gap_pct.toFixed(2)}%</span></div>
    <div class="metric-row"><span>Greedy solve time</span><span class="val">${gap.greedy_time_ms.toFixed(2)} ms</span></div>
    <div class="metric-row"><span>Brute-force solve time</span><span class="val">${gap.optimal_time_ms.toFixed(2)} ms</span></div>
  `;
}

function nodeById(id) {
  return trace.map.nodes.find(n => n.id === id);
}

function drawPolygon(poly, fillStyle, strokeStyle) {
  ctx.beginPath();
  poly.forEach(([x, y], i) => {
    const [sx, sy] = toScreen(x, y);
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  });
  ctx.closePath();
  ctx.fillStyle = fillStyle;
  ctx.fill();
  if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.stroke(); }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0e1013';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!trace) return;

  // base grid (subtle, GTA-minimap style)
  ctx.strokeStyle = '#1a1d23';
  ctx.lineWidth = 1;
  for (let i = 0; i <= CANVAS_UNITS; i += 100) {
    const [x1, y1] = toScreen(i, 0);
    const [x2, y2] = toScreen(i, CANVAS_UNITS);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const [x3, y3] = toScreen(0, i);
    const [x4, y4] = toScreen(CANVAS_UNITS, i);
    ctx.beginPath(); ctx.moveTo(x3, y3); ctx.lineTo(x4, y4); ctx.stroke();
  }

  // no-fly zones
  trace.map.no_fly_zones.forEach(z => {
    drawPolygon(z.polygon, 'rgba(255,107,107,0.18)', 'rgba(255,107,107,0.6)');
  });

  // nodes
  trace.map.nodes.forEach(n => {
    const [sx, sy] = toScreen(n.x, n.y);
    let color = '#555';
    let r = 4;
    if (n.kind === 'dark_store') { color = '#3aa0ff'; r = 8; }
    if (n.kind === 'delivery_zone') { color = '#ffd166'; r = 5; }
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    if (n.kind === 'dark_store') {
      ctx.fillStyle = '#c8d0da';
      ctx.font = '10px sans-serif';
      ctx.fillText(n.id.replace('DS_', ''), sx + 10, sy + 3);
    }
  });

  // animate delivered orders whose window includes simTime
  const scenario = trace.scenarios[currentScenario];
  const resultsByOrder = {};
  scenario.results.forEach(r => { resultsByOrder[r.order_id] = r; });

  scenario.orders.forEach(order => {
    const result = resultsByOrder[order.id];
    if (!result || result.status !== 'delivered') return;
    const start = order.created_at_s;
    const end = start + result.delivery_time_s;
    if (simTime < start || simTime > end) return;

    const path = result.path;
    if (!path || path.length < 2) return;
    const frac = (simTime - start) / (end - start);
    const segCount = path.length - 1;
    const segF = frac * segCount;
    const segIdx = Math.min(segCount - 1, Math.floor(segF));
    const localF = segF - segIdx;

    const a = nodeById(path[segIdx]);
    const b = nodeById(path[segIdx + 1]);
    if (!a || !b) return;
    const x = a.x + (b.x - a.x) * localF;
    const y = a.y + (b.y - a.y) * localF;
    const [sx, sy] = toScreen(x, y);

    ctx.beginPath();
    ctx.arc(sx, sy, 6, 0, Math.PI * 2);
    ctx.fillStyle = result.vehicle_kind === 'drone' ? '#4fd6a8' : '#c084fc';
    ctx.fill();
    ctx.strokeStyle = '#08110d';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function updateTimeLabel() {
  const m = Math.floor(simTime / 60).toString().padStart(2, '0');
  const s = Math.floor(simTime % 60).toString().padStart(2, '0');
  document.getElementById('timeLabel').textContent = `${m}:${s}`;
}

function tick() {
  if (!playing) return;
  simTime += 4; // sim-seconds per animation frame
  const scrubber = document.getElementById('scrubber');
  if (simTime > +scrubber.max) simTime = 0;
  scrubber.value = simTime;
  updateTimeLabel();
  draw();
  animFrame = requestAnimationFrame(tick);
}

document.getElementById('playBtn').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸ Pause' : '▶ Play';
  if (playing) tick();
});
document.getElementById('scrubber').addEventListener('input', (e) => {
  simTime = +e.target.value;
  updateTimeLabel();
  draw();
});
document.getElementById('stepBack').addEventListener('click', () => {
  simTime = Math.max(0, simTime - 30);
  document.getElementById('scrubber').value = simTime;
  updateTimeLabel(); draw();
});
document.getElementById('stepFwd').addEventListener('click', () => {
  simTime += 30;
  document.getElementById('scrubber').value = simTime;
  updateTimeLabel(); draw();
});
document.getElementById('scenarioSelect').addEventListener('change', (e) => {
  currentScenario = e.target.value;
  renderSummary();
  draw();
});
document.getElementById('loadBtn').addEventListener('click', loadTrace);

resizeCanvas();
loadTrace();
</script>
</body>
</html>
